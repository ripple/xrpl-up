name: Watch rippled Docker Image

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_image:
        description: 'Force-test a specific image (e.g. rippleci/rippled:3.1.2)'
        required: false
        type: string
  repository_dispatch:
    types: [test-rippled-image]  # gh api repos/ripple/xrpl-up/dispatches -f event_type=test-rippled-image -f 'client_payload[force_image]=rippleci/rippled:3.1.2'

jobs:
  # ── 1. Detect new images ───────────────────────────────────────────────────
  detect:
    name: Detect new rippled images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect new images
        id: detect
        run: |
          DIGESTS=".github/rippled-image-digests.json"
          IMAGES="[]"

          # ── Force mode (workflow_dispatch or repository_dispatch) ────────
          FORCE_IMAGE="${{ inputs.force_image || github.event.client_payload.force_image }}"
          if [ -n "$FORCE_IMAGE" ]; then
            IMAGES=$(jq -n --arg img "$FORCE_IMAGE" '[$img]')
            echo "Force-testing image: $FORCE_IMAGE"
            echo "images=$IMAGES" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── xrpllabsofficial/xrpld:latest — digest change ─────────────────
          CURRENT_DIGEST=$(curl -sf \
            "https://hub.docker.com/v2/repositories/xrpllabsofficial/xrpld/tags/latest" \
            | jq -r '.digest')
          KNOWN_DIGEST=$(jq -r '."xrpllabsofficial/xrpld".latest.digest' "$DIGESTS")

          if [ "$CURRENT_DIGEST" != "$KNOWN_DIGEST" ]; then
            echo "New digest for xrpllabsofficial/xrpld:latest: $CURRENT_DIGEST"
            IMAGES=$(echo "$IMAGES" | jq -c '. + ["xrpllabsofficial/xrpld:latest"]')
          else
            echo "xrpllabsofficial/xrpld:latest unchanged ($KNOWN_DIGEST)"
          fi

          # ── rippleci/rippled — new version tags ────────────────────────────
          REMOTE_TAGS=$(curl -sf \
            "https://hub.docker.com/v2/repositories/rippleci/rippled/tags?page_size=25&ordering=last_updated" \
            | jq -r '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name]')
          KNOWN_TAGS=$(jq -r '."rippleci/rippled".known_tags[]' "$DIGESTS")

          for TAG in $(echo "$REMOTE_TAGS" | jq -r '.[]'); do
            if ! echo "$KNOWN_TAGS" | grep -qx "$TAG"; then
              echo "New rippleci/rippled tag: $TAG"
              IMAGES=$(echo "$IMAGES" | jq -c --arg t "rippleci/rippled:$TAG" '. + [$t]')
            fi
          done

          echo "Images to test: $IMAGES"
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

  # ── 2. Run e2e tests against each new image ────────────────────────────────
  e2e:
    name: e2e (${{ matrix.image }}, node-${{ matrix.node-version }}, ${{ matrix.mode }})
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
        node-version: [20, 22, 24]
        mode: [standalone, local-network, snapshot, testnet]
        include:
          - mode: standalone
            test-script: test:e2e:local
          - mode: local-network
            test-script: test:e2e:local-network
          - mode: snapshot
            test-script: test:e2e:snapshot
          - mode: testnet
            test-script: test:e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Pull rippled image
        run: docker pull ${{ matrix.image }}

      - name: Run e2e tests (${{ matrix.mode }})
        env:
          XRPL_RIPPLED_IMAGE: ${{ matrix.image }}
          XRPL_LOCAL_TEARDOWN: '1'
        run: npm run ${{ matrix.test-script }}

  # ── 3. Update digest file after successful tests ────────────────────────────
  update-digests:
    name: Update known image digests
    needs: [detect, e2e]
    if: |
      needs.e2e.result == 'success' &&
      github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update digest file
        run: |
          DIGESTS=".github/rippled-image-digests.json"

          # Update xrpllabsofficial/xrpld:latest digest
          CURRENT_DIGEST=$(curl -sf \
            "https://hub.docker.com/v2/repositories/xrpllabsofficial/xrpld/tags/latest" \
            | jq -r '.digest')
          LAST_UPDATED=$(curl -sf \
            "https://hub.docker.com/v2/repositories/xrpllabsofficial/xrpld/tags/latest" \
            | jq -r '.last_updated')
          jq \
            --arg d "$CURRENT_DIGEST" \
            --arg u "$LAST_UPDATED" \
            '."xrpllabsofficial/xrpld".latest = {digest: $d, last_updated: $u}' \
            "$DIGESTS" > /tmp/digests.json && mv /tmp/digests.json "$DIGESTS"

          # Update rippleci/rippled known tags
          REMOTE_TAGS=$(curl -sf \
            "https://hub.docker.com/v2/repositories/rippleci/rippled/tags?page_size=25&ordering=last_updated" \
            | jq '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name]')
          jq --argjson tags "$REMOTE_TAGS" \
            '."rippleci/rippled".known_tags = $tags' \
            "$DIGESTS" > /tmp/digests.json && mv /tmp/digests.json "$DIGESTS"

          cat "$DIGESTS"

      - name: Commit updated digests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rippled-image-digests.json
          if git diff --cached --quiet; then
            echo "No digest changes to commit"
          else
            git commit -m "chore: update known rippled image digests [skip ci]"
            git push
          fi

  # ── 4. Bump DEFAULT_IMAGE in compose.ts and open a PR ─────────────────────
  bump-default-image:
    name: Bump pinned rippled image
    needs: [detect, e2e]
    if: |
      needs.e2e.result == 'success' &&
      github.event_name != 'workflow_dispatch' &&
      contains(fromJson(needs.detect.outputs.images), 'xrpllabsofficial/xrpld:latest')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Get current pinned version
        id: current
        run: |
          VERSION=$(grep "DEFAULT_IMAGE" src/core/compose.ts \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current pinned: ${VERSION}"

      - name: Get version tag matching latest digest
        id: latest
        run: |
          LATEST_DIGEST=$(curl -sf \
            "https://hub.docker.com/v2/repositories/xrpllabsofficial/xrpld/tags/latest" \
            | jq -r '.digest')
          # Find the highest semver tag whose digest matches latest
          MATCHING_TAG=$(curl -sf \
            "https://hub.docker.com/v2/repositories/xrpllabsofficial/xrpld/tags?page_size=50" \
            | jq -r --arg d "$LATEST_DIGEST" \
              '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | select(.digest == $d) | .name] | sort_by(split(".") | map(tonumber)) | last // empty')
          echo "version=${MATCHING_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version tag for latest: ${MATCHING_TAG}"

      - name: Check if bump needed
        id: diff
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          if [ -z "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version tag found matching latest digest — skipping."
          elif [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already pinned to ${CURRENT} — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Will bump ${CURRENT} → ${LATEST}"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          BRANCH="chore/bump-rippled-${LATEST}"

          sed -i "s|xrpllabsofficial/xrpld:[0-9]*\.[0-9]*\.[0-9]*|xrpllabsofficial/xrpld:${LATEST}|g" \
            src/core/compose.ts

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/core/compose.ts
          git commit -m "chore: bump rippled image ${CURRENT} → ${LATEST}"
          git push --force origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open — skipping."
            exit 0
          fi

          PR_BODY=$(mktemp)
          {
            echo "## Summary"
            echo ""
            echo "Bumps the pinned rippled image from \`xrpllabsofficial/xrpld:${CURRENT}\` to \`xrpllabsofficial/xrpld:${LATEST}\`."
            echo ""
            echo "## Tests"
            echo ""
            echo "The full \`test:e2e:local\` suite passed against \`xrpllabsofficial/xrpld:latest\` (which resolves to \`${LATEST}\`) before this PR was opened."
            echo ""
            echo "## Review checklist"
            echo ""
            echo "- [ ] Check the [rippled ${LATEST} release notes](https://github.com/XRPLF/rippled/releases/tag/${LATEST}) for breaking changes or new amendments"
            echo "- [ ] Verify no new amendments need to be added to \`NOT_ON_MAINNET\` in the amendment test"
            echo ""
            echo "> ⚠️ Do not auto-merge. Human review required before this lands in \`main\`."
          } > "$PR_BODY"

          gh pr create \
            --title "chore: bump rippled image ${CURRENT} → ${LATEST}" \
            --base main \
            --head "$BRANCH" \
            --body-file "$PR_BODY"
