name: xrpld tag

# Builds, tests and publishes an xrpl-up for ONE xrpld deb. Reusable: the poller
# (xrpld-poll.yml) calls it for every new build it finds, and it can be
# dispatched by hand with a version.
#   1. pin the deb in src/core/xrpld-source.json
#   2. build the xrpld image from it, boot it, and derive the default genesis
#      amendments (enabled on mainnet, supported, not Obsolete) into
#      src/core/default-amendments.json
#   3. run the e2e suites (no testnet) against that build
#   4. install it the way a user does (Node 22 and 24) and start it
#   5. if all of that passes, tag xrpld-<slug> and publish a release with the packed tarball
# If any step fails, one xrpld-failed-<n>-<slug> tag is added (see the poller for
# how failures are counted).
#
# No npm or Docker registry is involved. Install a build with
#   npm install -g github:<repo>#xrpld-<slug>

on:
  workflow_call:
    inputs:
      version:
        description: 'xrpld deb version, e.g. 0.0.0~dev-1238.20261005git9cbf78b'
        required: true
        type: string
      channel:
        description: 'packages.xrplf.org deb channel'
        required: false
        type: string
        default: deb-develop
  workflow_dispatch:
    inputs:
      version:
        description: 'xrpld deb version, e.g. 0.0.0~dev-1238.20261005git9cbf78b'
        required: true
        type: string
      channel:
        description: 'packages.xrplf.org deb channel'
        required: false
        type: string
        default: deb-develop

# The same build never runs twice at once, however it was started.
concurrency:
  group: xrpld-build-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  meta:
    name: Name the build
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - id: slug
        env:
          VERSION: ${{ inputs.version }}
        run: echo "slug=$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9_.-]/-/g')" >> "$GITHUB_OUTPUT"

  prepare:
    name: Pin ${{ needs.meta.outputs.slug }}
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pin the xrpld deb
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("src/core/xrpld-source.json", JSON.stringify({
              image: null,
              deb: { channel: process.env.CHANNEL, version: process.env.VERSION },
            }, null, 2) + "\n");
          '
      - name: Build the xrpld image and derive default amendments
        run: npm run generate:amendments
      - name: Commit to a build branch
        env:
          SLUG: ${{ needs.meta.outputs.slug }}
        run: |
          BRANCH="xrpld-build/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Commit the built dist/ too, so `npm install -g github:<repo>#<tag>` needs
          # no build on the user's machine (npm 10 skips the dev dependencies a build
          # needs). dist/ is gitignored, hence -f.
          npm run build
          git add -f dist
          git add src/core/xrpld-source.json src/core/default-amendments.json
          git commit -m "chore: build against xrpld $SLUG"
          git push --force origin "$BRANCH"

  test:
    name: Test ${{ needs.meta.outputs.slug }}
    needs: [meta, prepare]
    uses: ./.github/workflows/test.yml
    with:
      ref: xrpld-build/${{ needs.meta.outputs.slug }}
      upload-dist: false

  # Install the build the way a user does, from the build branch (the tag does not
  # exist yet), and start it, on every Node version the suites cover. A build that
  # cannot be installed or started is never tagged.
  verify-install:
    name: Install and start (node-${{ matrix.node-version }})
    needs: [meta, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      GH_TOKEN: ${{ github.token }}
      SLUG: ${{ needs.meta.outputs.slug }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      # No checkout: the point is to install from the git ref alone. The token lets
      # the install clone a private repo; for a public one it changes nothing.
      - name: Install from the build branch
        working-directory: ${{ runner.temp }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          npm --version
          npm install -g "github:${GITHUB_REPOSITORY}#xrpld-build/${SLUG}"
          xrpl-up --version
      - name: Start the local network
        working-directory: ${{ runner.temp }}
        run: xrpl-up start --local-network --no-secrets
      - name: Check the default amendments are enabled
        run: |
          PKG="$(npm root -g)/xrpl-up"
          EXPECTED=$(node -e 'console.log(require(process.argv[1]).amendments.length)' "$PKG/dist/core/default-amendments.json")
          INFO=$(docker exec xrpl-up-local-rippled-1 /usr/bin/xrpld --conf /etc/xrpld/xrpld.cfg --silent server_info)
          STATE=$(echo "$INFO" | jq -r '.result.info.server_state')
          ENABLED=$(docker exec xrpl-up-local-rippled-1 /usr/bin/xrpld --conf /etc/xrpld/xrpld.cfg --silent feature | jq '[.result.features[] | select(.enabled)] | length')
          echo "server_state=$STATE enabled=$ENABLED expected=$EXPECTED"
          [ "$STATE" = "proposing" ] && [ "$ENABLED" = "$EXPECTED" ]
      - name: Enable one more amendment
        working-directory: ${{ runner.temp }}
        run: |
          # Any amendment the build supports that is neither enabled nor retired.
          NAME=$(docker exec xrpl-up-local-rippled-1 /usr/bin/xrpld --conf /etc/xrpld/xrpld.cfg --silent feature \
            | jq -r '[.result.features[] | select(.supported and (.enabled | not) and (.vetoed != "Obsolete")) | .name] | sort | first')
          BEFORE=$(docker exec xrpl-up-local-rippled-1 /usr/bin/xrpld --conf /etc/xrpld/xrpld.cfg --silent feature | jq '[.result.features[] | select(.enabled)] | length')
          echo "enabling $NAME (enabled now: $BEFORE)"
          xrpl-up amendment enable "$NAME" --auto-reset
          xrpl-up start --local-network --no-secrets
          AFTER=$(docker exec xrpl-up-local-rippled-1 /usr/bin/xrpld --conf /etc/xrpld/xrpld.cfg --silent feature | jq '[.result.features[] | select(.enabled)] | length')
          ON=$(docker exec xrpl-up-local-rippled-1 /usr/bin/xrpld --conf /etc/xrpld/xrpld.cfg --silent feature | jq -r --arg n "$NAME" '[.result.features[] | select(.name == $n and .enabled)] | length')
          echo "enabled after: $AFTER, $NAME enabled: $ON"
          [ "$AFTER" = "$((BEFORE + 1))" ] && [ "$ON" = "1" ]
      - name: Stop
        if: always()
        working-directory: ${{ runner.temp }}
        run: xrpl-up stop || true

  publish:
    name: Publish ${{ needs.meta.outputs.slug }}
    needs: [meta, verify-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: xrpld-build/${{ needs.meta.outputs.slug }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pack
        id: pack
        env:
          SLUG: ${{ needs.meta.outputs.slug }}
        run: |
          PKG=$(npm pack --silent)
          OUT="${PKG%.tgz}-xrpld-$SLUG.tgz"
          mv "$PKG" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.meta.outputs.slug }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          TAG="xrpld-$SLUG"
          gh release create "$TAG" "$FILE" --target "$(git rev-parse HEAD)" --prerelease \
            --title "xrpl-up for xrpld $VERSION" \
            --notes "xrpl-up built against xrpld \`$VERSION\` (\`$CHANNEL\`), e2e tested. Install: \`npm install -g github:${GITHUB_REPOSITORY}#$TAG\`. The default genesis amendments for this build are in \`src/core/default-amendments.json\`."
          # The tag keeps the commit; the build branch is no longer needed.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/xrpld-build/$SLUG" || true

  # Count one failed attempt if pinning, testing or publishing failed (a
  # cancelled run is not a failure), and drop the build branch.
  mark-failed:
    name: Mark failed ${{ needs.meta.outputs.slug }}
    needs: [meta, prepare, test, verify-install, publish]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.test.result == 'failure' || needs.verify-install.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Count the failed attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.meta.outputs.slug }}
        run: |
          N=$(( $(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/xrpld-failed-*-$SLUG" | wc -l) + 1 ))
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/xrpld-failed-$N-$SLUG" -f "sha=$GITHUB_SHA" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/xrpld-build/$SLUG" || true
