name: Test

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (defaults to triggering commit)'
        required: false
        type: string
      upload-dist:
        description: 'Upload the dist/ artifact after a successful build'
        required: false
        type: boolean
        default: false
      network-tests:
        description: 'Also run the suite against the live public testnet/devnet (npm releases only)'
        required: false
        type: boolean
        default: false

# One group per ref under test. When this workflow is called with an explicit
# `ref` (one xrpld build, or a release), that ref is the key, so different builds
# never cancel each other. Keying on github.ref alone put every build's jobs in
# one group with cancel-in-progress, so each job that started cancelled the
# previous one and nothing finished.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: e2e (node-${{ matrix.node-version }}, ${{ matrix.mode.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # standalone, local-network and snapshot run a local xrpld in Docker, so
      # they are deterministic and run everywhere.
      #
      # "testnet" runs the whole suite against the live public testnet/devnet
      # (including vault/** and the *.network.test.ts files that the local
      # config excludes because they need a real network). It is slow and fails
      # on upstream connectivity rather than on our changes, so it only runs
      # when the caller passes network-tests: true (the npm release does; pushes,
      # PRs and per-xrpld-build runs do not).
      #
      # Modes are objects rather than a list plus include:, because an include:
      # entry whose mode matches no combination creates one and would silently
      # bring testnet back.
      matrix:
        node-version: [22, 24]
        mode: >-
          ${{ inputs.network-tests
              && fromJSON('[{"name":"standalone","script":"test:e2e:local"},{"name":"local-network","script":"test:e2e:local-network"},{"name":"snapshot","script":"test:e2e:snapshot"},{"name":"testnet","script":"test:e2e"}]')
              || fromJSON('[{"name":"standalone","script":"test:e2e:local"},{"name":"local-network","script":"test:e2e:local-network"},{"name":"snapshot","script":"test:e2e:snapshot"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Log in to ghcr.io
        # A pinned xrpld image may live in the calling repo's ghcr.io namespace. Public
        # images and local deb builds don't need the login, so a failure is ignored.
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
      - name: Prepare xrpld image
        # Builds the pinned deb into a local image, or pulls a registry image,
        # whichever src/core/xrpld-source.json says — nothing is hardcoded here.
        run: node -e "const x = require('./dist/core/xrpld-image'); x.ensureImage(x.DEFAULT_IMAGE)"
      - name: Run e2e tests (${{ matrix.mode.name }})
        env:
          XRPL_LOCAL_TEARDOWN: '1'
        run: npm run ${{ matrix.mode.script }}
      - name: Upload dist artifact
        # Only upload from the canonical Node version used by the release job.
        # Uploading from all matrix legs would create duplicate artifacts.
        if: ${{ inputs.upload-dist && matrix.node-version == 22 && matrix.mode.name == 'standalone' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

