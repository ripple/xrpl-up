name: xrpld develop build

# Builds an xrpl-up for every new xrpld build in packages.xrplf.org's deb-develop
# channel. Each build:
#   1. pins the deb in src/core/xrpld-source.json
#   2. builds the xrpld image from it, boots it, and derives the default genesis
#      amendments (enabled on mainnet, supported, not Obsolete) into
#      src/core/default-amendments.json
#   3. runs the e2e suites against it
#   4. is tagged and published as a release with the packed tarball
#
# No npm or Docker registry is involved: the tarball is installed directly and
# builds its xrpld image locally on first start.
#
# New builds are found by polling: packages.xrplf.org can't notify us. A build
# is "already done" when a tag xrpld-<slug> exists, and everything newer than
# the newest tagged build is built, oldest first (at most 10 per run).

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build this one xrpld deb version instead of looking for new ones'
        required: false
        type: string

# A newer run replaces a queued one, which loses nothing: every run works out
# what to build from the tags that exist when it starts.
concurrency:
  group: xrpld-develop-build
  cancel-in-progress: false

env:
  DEB_CHANNEL: deb-develop

jobs:
  detect:
    name: Find new xrpld builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      builds: ${{ steps.detect.outputs.builds }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: List builds newer than the last tagged one
        id: detect
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            SLUG=$(printf '%s' "$INPUT_VERSION" | sed 's/[^A-Za-z0-9_.-]/-/g')
            RUN=$(printf '%s' "$SLUG" | sed -n 's/.*-\([0-9]\{1,\}\)\.[0-9]\{8\}git.*/\1/p')
            BUILDS=$(node -e 'console.log(JSON.stringify([{version: process.argv[1], slug: process.argv[2], run: Number(process.argv[3]) || 0}]))' "$INPUT_VERSION" "$SLUG" "$RUN")
          else
            # Newest run number among existing xrpld-<slug> tags (0 if none).
            LAST=$(git ls-remote --tags origin 'refs/tags/xrpld-*' \
              | sed -n 's|.*refs/tags/xrpld-.*-\([0-9]\{1,\}\)\.[0-9]\{8\}git.*|\1|p' \
              | sort -n | tail -1)
            LAST=${LAST:-0}
            echo "newest tagged run: $LAST"
            BUILDS=$(npx tsx scripts/new-xrpld-debs.ts "$DEB_CHANNEL" "$LAST" 10)
          fi
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
          if [ "$BUILDS" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"; echo "nothing new"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"; echo "to build: $BUILDS"
          fi

  prepare:
    name: Pin ${{ matrix.slug }}
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.builds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pin the xrpld deb
        env:
          VERSION: ${{ matrix.version }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("src/core/xrpld-source.json", JSON.stringify({
              image: null,
              deb: { channel: process.env.DEB_CHANNEL, version: process.env.VERSION },
            }, null, 2) + "\n");
          '
      - name: Build the xrpld image and derive default amendments
        run: npm run generate:amendments
      - name: Commit to a build branch
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          BRANCH="xrpld-build/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/core/xrpld-source.json src/core/default-amendments.json
          # Nothing to commit when the checked-out source already pins this build.
          git diff --cached --quiet || git commit -m "chore: build against xrpld $SLUG"
          git push --force origin "$BRANCH"

  test:
    name: Test ${{ matrix.slug }}
    needs: [detect, prepare]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.builds) }}
    uses: ./.github/workflows/test.yml
    with:
      ref: xrpld-build/${{ matrix.slug }}
      upload-dist: false

  publish:
    name: Publish ${{ matrix.slug }}
    needs: [detect, prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.builds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: xrpld-build/${{ matrix.slug }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pack
        id: pack
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          PKG=$(npm pack --silent)
          OUT="${PKG%.tgz}-xrpld-$SLUG.tgz"
          mv "$PKG" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ matrix.slug }}
          VERSION: ${{ matrix.version }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          TAG="xrpld-$SLUG"
          gh release create "$TAG" "$FILE" --target "$(git rev-parse HEAD)" --prerelease \
            --title "xrpl-up for xrpld $VERSION" \
            --notes "xrpl-up built against xrpld \`$VERSION\` (\`$DEB_CHANNEL\`). Install the attached tarball: \`npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$FILE\`. (Do not install from the git ref: that builds on your machine, and npm 10 skips the dev dependencies the build needs, so it fails with \"tsc: command not found\".) The default genesis amendments for this build are in \`src/core/default-amendments.json\`."
