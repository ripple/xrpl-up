name: xrpld develop build

# When a new xrpld build appears in packages.xrplf.org's deb-develop channel,
# build an xrpl-up that runs exactly that build:
#   1. pin the deb in src/core/xrpld-source.json
#   2. build the xrpld image from it, boot it, and derive the default genesis
#      amendments (enabled on mainnet, supported, not Obsolete) into
#      src/core/default-amendments.json
#   3. run the hermetic e2e suites against it
#   4. tag the result and publish the packed tarball as a release asset
#
# No npm or Docker registry is involved: the tarball is installed directly and
# builds its xrpld image locally on first start.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'xrpld deb version to build (default: newest in the channel)'
        required: false
        type: string

concurrency:
  group: xrpld-develop-build
  cancel-in-progress: false

env:
  DEB_CHANNEL: deb-develop

jobs:
  detect:
    name: Detect new xrpld build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      slug: ${{ steps.detect.outputs.slug }}
      new: ${{ steps.detect.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Find the xrpld build
        id: detect
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${INPUT_VERSION:-$(npx tsx scripts/latest-xrpld-deb.ts "$DEB_CHANNEL")}"
          # Same mapping src/core/xrpld-image.ts uses for the image tag.
          SLUG=$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9_.-]/-/g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/xrpld-$SLUG" >/dev/null 2>&1; then
            echo "xrpld $VERSION already built"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new xrpld build: $VERSION"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Pin xrpld and derive amendments
    needs: detect
    if: needs.detect.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pin the xrpld deb
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const f = "src/core/xrpld-source.json";
            fs.writeFileSync(f, JSON.stringify({
              image: null,
              deb: { channel: process.env.DEB_CHANNEL, version: process.env.VERSION },
            }, null, 2) + "\n");
          '
      - name: Build the xrpld image and derive default amendments
        run: npm run generate:amendments
      - name: Commit to a build branch
        id: push
        env:
          SLUG: ${{ needs.detect.outputs.slug }}
        run: |
          BRANCH="xrpld-build/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/core/xrpld-source.json src/core/default-amendments.json
          git commit -m "chore: build against xrpld $SLUG"
          git push --force origin "$BRANCH"
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [detect, prepare]
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      upload-dist: false

  publish:
    name: Tag and publish
    needs: [detect, prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Pack
        id: pack
        env:
          SLUG: ${{ needs.detect.outputs.slug }}
        run: |
          PKG=$(npm pack --silent)
          OUT="${PKG%.tgz}-xrpld-$SLUG.tgz"
          mv "$PKG" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ needs.detect.outputs.slug }}
          VERSION: ${{ needs.detect.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          TAG="xrpld-$SLUG"
          gh release create "$TAG" "$FILE" --target "$(git rev-parse HEAD)" --prerelease \
            --title "xrpl-up for xrpld $VERSION" \
            --notes "xrpl-up built against xrpld \`$VERSION\` (\`$DEB_CHANNEL\`). Install: \`npm install -g ./$FILE\`. The default genesis amendments for this build are in \`src/core/default-amendments.json\`."
